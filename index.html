<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freedom Fellowship — Worship</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  #hud {
    position: fixed; left: 4vw; bottom: 12vh; z-index: 5;
    font: 600 clamp(16px, 2.0vw, 30px)/1.3 "Segoe UI", system-ui, sans-serif;
    color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.9);
    opacity: 0; transition: opacity .5s ease; pointer-events: none;
  }
  #hud.show { opacity: .88; }
  #hud small { display: block; font-weight: 400; font-size: .62em; opacity: .7; margin-top: .35em; letter-spacing: .08em; text-transform: uppercase; }

  #controls {
    position: fixed; left: 50%; bottom: 3.2vh; transform: translateX(-50%);
    display: flex; gap: clamp(8px, 1vw, 16px); z-index: 8;
    opacity: 0; transition: opacity .35s ease; pointer-events: none;
  }
  #controls.show { opacity: 1; pointer-events: auto; }
  #controls button {
    display: flex; align-items: center; gap: .55em; cursor: pointer;
    padding: .8em 1.3em; border-radius: 999px; color: #fff;
    background: rgba(18,18,20,.74); border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font: 600 clamp(13px, 1.05vw, 17px)/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .01em; transition: background .15s ease, transform .08s ease;
  }
  #controls button:hover { background: rgba(44,44,50,.94); }
  #controls button:active { transform: scale(.96); }
  #controls svg { width: 1.3em; height: 1.3em; fill: currentColor; }

  #start {
    position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; gap: 1.4rem;
    text-align: center; background: #000; color: #fff; cursor: pointer;
    font: 400 clamp(15px, 1.5vw, 22px)/1.6 "Segoe UI", system-ui, sans-serif;
  }
  #start h1 { font: 700 clamp(28px, 4vw, 64px)/1.1 "Segoe UI", system-ui, sans-serif; letter-spacing: -.02em; }
  #start .k { display: inline-block; margin-top: .6rem; padding: .45em .8em; border: 1px solid #444; border-radius: 999px; font-size: .8em; opacity: .8; }
  #start.hidden { display: none; }
  #err { position: fixed; left: 2vw; bottom: 2vh; color: #f66; font: 14px monospace; z-index: 20; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>

<div id="controls">
  <button id="b-restart" title="Start this song over (R)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    Start over
  </button>
  <button id="b-prev" title="Previous (left arrow)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h2.2v14H7zm11 0v14l-9.2-7z"/></svg>
    Previous
  </button>
  <button id="b-pause" title="Play / pause (Space)">
    <svg id="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zm5 0h3v14h-3z"/></svg>
    <svg id="i-play" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M7 4.5v15l13-7.5z"/></svg>
    <span id="t-pause">Pause</span>
  </button>
  <button id="b-next" title="Next (right arrow)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.8 5H17v14h-2.2zM6 5l9.2 7L6 19z"/></svg>
    Next
  </button>
</div>

<div id="start">
  <div>
    <h1>Freedom Fellowship</h1>
    <div>Worship</div>
    <div class="k">Click anywhere to begin · Space pause · ← → skip · R restart · F fullscreen</div>
  </div>
</div>
<div id="err"></div>

<script>
/* ---------------------------------------------------------------
   ORDER
   Item 0 is the instrumental intro. It plays once, then everything
   after it loops forever so the set can run unattended.
   --------------------------------------------------------------- */
const ITEMS = [
  { type: "video", id: "C1wFmXGPbUg", title: "Instrumental — gather", note: "1:03",               section: "Intro" },
  { type: "video", id: "zhmwQwXCK0o", title: "Lord I Need You",       note: "Matt Maher",          section: "Worship" },
  { type: "video", id: "xhYboRutSGY", title: "Scandal of Grace",      note: "Hillsong UNITED",     section: "Worship" },
  { type: "video", id: "Rv55qS7v2-c", title: "Give Us Clean Hands",   note: "Chris Tomlin",        section: "Worship" },
  { type: "video", id: "rrVPo6dO2e8", title: "In the Room",           note: "Forrest Frank",       section: "Worship" },
  { type: "video", id: "3zARVp3420I", title: "Holy Spirit",           note: "Francesca Battistelli", section: "Worship" },
  { type: "video", id: "ZvotrMIdTQw", title: "Cornerstone",           note: "Hillsong Worship",    section: "Worship" },
  { type: "video", id: "SzZZb6RbLJs", title: "Tremble",               note: "Mosaic MSC",          section: "Worship" },
  { type: "video", id: "IvSuGyJQ6oM", title: "Goodness of God",       note: "Bethel Music",        section: "Worship" },
  { type: "video", id: "ifFovH-dhHw", title: "Living Hope",           note: "Phil Wickham",        section: "Worship" }
];

const LOOP_START = 1;                    /* intro plays once; the loop begins after it */
const LOOP_END   = ITEMS.length - 1;

const stage = document.getElementById("stage");
const hud = document.getElementById("hud");
const controls = document.getElementById("controls");
const startScreen = document.getElementById("start");
const errBox = document.getElementById("err");

let player = null, index = 0, ticker = null, starting = false;

/* ---------- chrome that fades out when nobody touches the mouse ---------- */
let hideT = null;
function wake(ms = 4000) {
  hud.classList.add("show");
  controls.classList.add("show");
  clearTimeout(hideT);
  hideT = setTimeout(() => {
    hud.classList.remove("show");
    controls.classList.remove("show");
  }, ms);
}
["mousemove", "touchstart"].forEach(ev =>
  document.addEventListener(ev, () => wake(), { passive: true }));

function showHud(i) {
  const item = ITEMS[i];
  hud.innerHTML = `${item.title}<small>${item.note} · ${item.section}</small>`;
  wake(5000);
}

function loadYtApi() {
  return new Promise((resolve, reject) => {
    if (window.YT && window.YT.Player) return resolve();
    window.onYouTubeIframeAPIReady = () => resolve();
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => reject(new Error("iframe_api failed"));
    document.head.appendChild(s);
  });
}

function clearStage() {
  clearInterval(ticker);
  ticker = null;
  if (player && player.destroy) { try { player.destroy(); } catch (_) {} }
  player = null;
  window.__player = null;
  stage.innerHTML = "";
}

function mount(i) {
  index = Math.max(0, Math.min(ITEMS.length - 1, i));
  const item = ITEMS[index];
  errBox.textContent = "";
  clearStage();

  const frame = document.createElement("div");
  frame.id = "yt" + Date.now();
  stage.appendChild(frame);
  showHud(index);

  player = window.__player = new YT.Player(frame.id, {
    videoId: item.id,
    playerVars: {
      autoplay: 1, mute: 1,
      controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3,
      disablekb: 1, fs: 1, playsinline: 1, cc_load_policy: 0
    },
    events: {
      onReady: e => {
        e.target.playVideo();
        killCaptions(e.target);
        /* browsers only allow muted autoplay; the click on the start screen
           is what lets us turn sound back on a moment later */
        setTimeout(() => { try { e.target.unMute(); e.target.setVolume(100); } catch (_) {} }, 900);
        watchEnd();
      },
      onStateChange: e => {
        killCaptions(e.target);
        setPauseUi(e.data === YT.PlayerState.PLAYING);
        if (e.data === YT.PlayerState.ENDED) next();
      },
      onError: e => { errBox.textContent = "Video " + item.id + " error " + e.data; next(); }
    }
  });
}

/* Advance ~2s before the true end so YouTube's end-screen links never appear. */
function watchEnd() {
  clearInterval(ticker);
  ticker = setInterval(() => {
    if (!player || !player.getDuration) return;
    /* keep captions down even if YouTube re-enables them mid-video */
    if (player.getOption) {
      try {
        const tr = player.getOption("captions", "track");
        if (tr && tr.languageCode) killCaptions(player);
      } catch (_) {}
    }
    const d = player.getDuration(), t = player.getCurrentTime();
    if (d > 0 && t > 0 && d - t <= 2) { clearInterval(ticker); next(); }
  }, 500);
}

/* ---------- navigation: intro once, then the songs loop ---------- */
function next() {
  if (index >= LOOP_END) { mount(LOOP_START); return; }   /* wrap back to the first song */
  mount(index + 1);
}
function prev() {
  if (index === 0) return;
  mount(index - 1);                                        /* from the first song this returns to the intro */
}
function restart() {
  if (!player || !player.seekTo) return;
  player.seekTo(0, true);
  player.playVideo();
  wake(3000);
  showHud(index);
}
function togglePlay() {
  if (!player || !player.getPlayerState) return;
  player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
  wake(3000);
}
function setPauseUi(playing) {
  const t = document.getElementById("t-pause");
  const ip = document.getElementById("i-pause");
  const il = document.getElementById("i-play");
  if (!t) return;
  t.textContent = playing ? "Pause" : "Play";
  ip.style.display = playing ? "" : "none";
  il.style.display = playing ? "none" : "";
}

/* Captions turn themselves back on when the viewer's YouTube account has them
   enabled, so strip the caption module every time a video starts. */
function killCaptions(p) {
  if (!p || !p.unloadModule) return;
  try { p.unloadModule("captions"); } catch (_) {}
  try { p.unloadModule("cc"); } catch (_) {}
  try { p.setOption("captions", "track", {}); } catch (_) {}
  try { p.setOption("cc", "track", {}); } catch (_) {}
}

/* ---------- buttons ---------- */
[["b-restart", restart], ["b-prev", prev], ["b-pause", togglePlay], ["b-next", next]].forEach(([id, fn]) => {
  document.getElementById(id).addEventListener("click", e => {
    e.stopPropagation();
    fn();
  });
});

function begin() {
  if (starting) return;
  starting = true;

  /* Browsers refuse YouTube embeds inside a local file (player error 153). */
  if (location.protocol === "file:") {
    startScreen.classList.add("hidden");
    errBox.style.font = "500 clamp(16px,1.6vw,26px)/1.7 'Segoe UI',system-ui,sans-serif";
    errBox.style.color = "#fff";
    errBox.style.left = "8vw"; errBox.style.right = "8vw"; errBox.style.bottom = "44vh";
    errBox.innerHTML = "This page has to be served over http/https, not opened as a file." +
      "<br><span style='opacity:.75'>YouTube blocks video inside local files (error 153). " +
      "Use https://critfusion.github.io/ff-worship-player/ instead.</span>";
    return;
  }
  startScreen.classList.add("hidden");
  loadYtApi().then(() => mount(0)).catch(e => errBox.textContent = e.message);
}

startScreen.addEventListener("click", begin);
document.addEventListener("keydown", e => {
  if (!starting) { begin(); return; }
  if (e.code === "Space") {
    e.preventDefault();
    togglePlay();
  }
  if (e.code === "ArrowRight") { e.preventDefault(); next(); }
  if (e.code === "ArrowLeft") { e.preventDefault(); prev(); }
  if (e.key === "r" || e.key === "R") restart();
  if (e.key === "f" || e.key === "F") {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
</script>
</body>
</html>
