<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2026 Fall Retreat — Worship</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #hud {
    position: fixed; left: 4vw; bottom: 5vh; z-index: 5;
    font: 600 clamp(16px, 2.0vw, 30px)/1.3 "Segoe UI", system-ui, sans-serif;
    color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.9);
    opacity: 0; transition: opacity .5s ease; pointer-events: none;
  }
  #hud.show { opacity: .85; }
  #hud small { display: block; font-weight: 400; font-size: .62em; opacity: .7; margin-top: .35em; }
  #start {
    position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; gap: 1.4rem;
    text-align: center; background: #000; color: #fff; cursor: pointer;
    font: 400 clamp(15px, 1.5vw, 22px)/1.6 "Segoe UI", system-ui, sans-serif;
  }
  #start h1 { font: 700 clamp(28px, 4vw, 64px)/1.1 "Segoe UI", system-ui, sans-serif; letter-spacing: -.02em; }
  #start .k { display: inline-block; margin-top: .6rem; padding: .45em .8em; border: 1px solid #444; border-radius: 999px; font-size: .8em; opacity: .8; }
  #start.hidden { display: none; }
  #err { position: fixed; left: 2vw; bottom: 2vh; color: #f66; font: 14px monospace; z-index: 20; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<div id="start">
  <div>
    <h1>2026 Fall Retreat</h1>
    <div>Worship — Psalm 51</div>
    <div class="k">Click anywhere to begin · Space pause · ← → skip · F fullscreen</div>
  </div>
</div>
<div id="err"></div>

<script>
const VIDEOS = [
  { id: "KjOa0TQSQaQ", title: "Instrumental — gather",        note: "1:17" },
  { id: "Rv55qS7v2-c", title: "Give Us Clean Hands",          note: "Chris Tomlin" },
  { id: "0Vf6KN4vqwU", title: "Hold On",                      note: "Katy Nichole" },
  { id: "fiyYoe678yI", title: "Broken Vessels (Amazing Grace)", note: "Hillsong Worship" },
  { id: "skAdCyew2B8", title: "Lord I Need You",              note: "backup — Matt Maher" }
];

const stage = document.getElementById("stage");
const hud = document.getElementById("hud");
const startScreen = document.getElementById("start");
const errBox = document.getElementById("err");

let player = null, index = 0, ticker = null, starting = false;

function showHud(i) {
  const v = VIDEOS[i];
  hud.innerHTML = `${i + 1}/${VIDEOS.length} &nbsp; ${v.title}<small>${v.note}</small>`;
  hud.classList.add("show");
  clearTimeout(showHud.t);
  showHud.t = setTimeout(() => hud.classList.remove("show"), 6000);
}

function loadYtApi() {
  return new Promise((resolve, reject) => {
    if (window.YT && window.YT.Player) return resolve();
    window.onYouTubeIframeAPIReady = () => resolve();
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => reject(new Error("iframe_api failed"));
    document.head.appendChild(s);
  });
}

function mount(i, autoplay = true) {
  index = (i + VIDEOS.length) % VIDEOS.length;
  errBox.textContent = "";
  stage.innerHTML = "";
  const frame = document.createElement("div");
  frame.id = "yt" + Date.now();
  stage.appendChild(frame);
  showHud(index);

  player = window.__player = new YT.Player(frame.id, {
    videoId: VIDEOS[index].id,
    playerVars: {
      autoplay: autoplay ? 1 : 0, mute: autoplay ? 1 : 0,
      controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3,
      disablekb: 1, fs: 1, playsinline: 1
    },
    events: {
      onReady: e => {
        e.target.playVideo();
        /* browsers only allow muted autoplay; the click on the start screen
           is what lets us turn sound back on a moment later */
        setTimeout(() => { try { e.target.unMute(); e.target.setVolume(100); } catch (_) {} }, 900);
        watchEnd();
      },
      onStateChange: e => { window.__state = e.data; if (e.data === YT.PlayerState.ENDED) next(); },
      onError: e => { errBox.textContent = "Video " + VIDEOS[index].id + " error " + e.data; next(); }
    }
  });
}

/* Advance ~2s before the true end so YouTube's end-screen links never appear. */
function watchEnd() {
  clearInterval(ticker);
  ticker = setInterval(() => {
    if (!player || !player.getDuration) return;
    const d = player.getDuration();
    const t = player.getCurrentTime();
    if (d > 0 && t > 0 && d - t <= 2) { clearInterval(ticker); next(); }
  }, 500);
}

function next() { clearInterval(ticker); mount(index + 1); }
function prev() { clearInterval(ticker); mount(index - 1); }

function begin() {
  if (starting) return;
  starting = true;

  /* Browsers refuse YouTube embeds inside a local file (player error 153).
     Serve the page instead - the launcher scripts do that automatically. */
  if (location.protocol === "file:") {
    startScreen.classList.add("hidden");
    errBox.style.font = "500 clamp(16px,1.6vw,26px)/1.7 'Segoe UI',system-ui,sans-serif";
    errBox.style.color = "#fff";
    errBox.style.left = "8vw"; errBox.style.right = "8vw"; errBox.style.bottom = "44vh";
    errBox.innerHTML = "This page has to be opened through the launcher, not by double-clicking the file." +
      "<br><span style='opacity:.75'>YouTube blocks video inside local files (error 153). " +
      "Run <b>run-player-windows.bat</b> (or the .sh on a Mac) in this folder — it serves the page and opens it for you.</span>";
    return;
  }
  startScreen.classList.add("hidden");
  loadYtApi().then(() => mount(0)).catch(e => errBox.textContent = e.message);
}

startScreen.addEventListener("click", begin);
document.addEventListener("keydown", e => {
  if (starting === false) { begin(); return; }
  if (e.code === "Space") { e.preventDefault();
    if (!player) return;
    player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); }
  if (e.code === "ArrowRight") next();
  if (e.code === "ArrowLeft") prev();
  if (e.key === "f" || e.key === "F") {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
</script>
</body>
</html>
